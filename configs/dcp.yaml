# ==========================================================
# 非扩散对照基线 - 暗通道先验 (Dark Channel Prior) 去雾
# 纯传统算法，无需任何权重，开箱即用
# ==========================================================
name: dcp
display_name: 对照基线 (DCP 暗通道先验)
description: 经典暗通道先验去雾算法，无需权重，作为非扩散方法的定量对照列。

restorer: dcp

data:
  max_side: 1024
  size_multiple: 1

dcp:
  patch_size: 15          # 暗通道局部最小值窗口
  omega: 0.95             # 保留一点雾，避免过增强
  t0: 0.1                 # 透射率下限
  guided_radius: 40       # 引导滤波半径
  guided_eps: 0.001       # 引导滤波正则项
